<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lectura Bíblica Diaria - Enero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e8f5e9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 450px; width: 100%; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #2e7d32; font-size: 24px; margin-bottom: 5px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; }
    input:focus { border-color: #2e7d32; }
    
    .boton { 
      display: block; width: 100%; padding: 15px; margin-top: 15px; 
      font-size: 16px; font-weight: bold; text-decoration: none; 
      border-radius: 8px; cursor: pointer; border: none; transition: 0.3s;
    }

    .btn-video { background: #c4302b; color: white; }
    .btn-confirmar { background: #2e7d32; color: white; }
    .btn-confirmar:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
    
    .hidden { display: none; }
    .alerta { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; font-size: 14px; margin-top: 15px; border: 1px solid #ffeeba; line-height: 1.4; }
    .success-text { color: #2e7d32; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div id="paso-registro">
    <h1>🙏 Mi Lectura Diaria</h1>
    <p class="subtitle">Enero: Un mes para conocer su Palabra</p>
    <input type="text" id="nombreInput" placeholder="Nombre Completo">
    <input type="password" id="passInput" placeholder="Contraseña del grupo">
    <button class="boton btn-confirmar" onclick="iniciarSesion()">Ingresar</button>
  </div>

  <div id="paso-lectura" class="hidden">
    <h2 id="saludoUsuario" style="color: #2e7d32; margin-bottom: 10px;"></h2>
    <p>Haz clic en el botón rojo para ver la lectura de hoy. Luego regresa para confirmar.</p>
    
    <a id="linkVideo" class="boton btn-video" href="#" target="_blank" onclick="activarBoton()">
      📺 Ver Lectura en YouTube
    </a>

    <div id="msg-espera" class="alerta">
      ⚠️ El botón de abajo se activará después de que abras el video.
    </div>

    <button id="btnConfirmar" class="boton btn-confirmar" disabled onclick="enviarRegistro()">
      ✅ Confirmar Lectura Realizada
    </button>
    <p id="msg-final" class="hidden success-text">Abriendo registro oficial...</p>
  </div>
</div>

<script>
  // --- CONFIGURACIÓN DE SEGURIDAD Y FORMULARIO ---
  const MI_CONTRASEÑA = "biblia"; 
  const URL_FORM = "https://docs.google.com/forms/d/e/1FAIpQLScwjjL-3BCj4pWX4haAnZScGwspprj6zfwKGkEn0udpsPOfmQ/viewform";
  
  const ID_CAMPO_NOMBRE = "entry.619211418"; 
  const ID_CAMPO_FECHA  = "entry.2073927213"; 
  const ID_CAMPO_ESTADO = "entry.1592546460"; 

  // --- PROGRAMACIÓN DE VIDEOS DE ENERO ---
  const videosMes = {
    1: "https://youtu.be/UsLIwNoKyCQ",
    2: "https://youtu.be/fJOqSKiyC4U",
    3: "https://youtu.be/wXSks6HggpM",
    4: "https://youtu.be/2qdDYXtDRWQ",
    5: "https://youtu.be/6O8Y44LK5yQ",
    6: "https://youtu.be/TX-CWNEtfA4",
    7: "https://youtu.be/Qr48v5J7E-U",
    8: "https://youtu.be/sKPivln2v_Q",
    9: "https://youtu.be/vVKoNcR7cdk",
    10: "https://youtu.be/cUpbHIb6nYQ",
    11: "https://youtu.be/d8p_U1hcH_8",
    12: "https://youtu.be/RiAmBXI7dZs",
    13: "https://youtu.be/8TPfN8xcb44",
    14: "https://youtu.be/XJt4hYVFD7Y",
    15: "https://youtu.be/baHvSMkTgRQ",
    16: "https://youtu.be/PbFvPeOxk_0",
    17: "https://youtu.be/9SgjEQ_UDxY",
    18: "https://youtu.be/qjZQoMm6EkM",
    19: "https://youtu.be/FNFn60u5D4o",
    20: "https://youtu.be/7s4V987fSlk",
    21: "https://youtu.be/4RFwHrBTc-E",
    22: "https://youtu.be/L4VgcdEPsJQ",
    23: "https://youtu.be/0VjS5moActA",
    24: "https://youtu.be/gztyEQhNQkE",
    25: "https://youtu.be/DFaAU1Dh6kg",
    26: "https://youtu.be/nGe5132Cbwo",
    27: "https://youtu.be/ywfA9yCqLQM",
    28: "https://youtu.be/fZ9VG-QD4oE",
    29: "https://youtu.be/FOhxK71B0G8"
  };

  let nombreUsuario = "";

  function iniciarSesion() {
    const nombre = document.getElementById("nombreInput").value.trim();
    const pass = document.getElementById("passInput").value;

    if (nombre.length < 4) return alert("Por favor, ingresa tu nombre completo.");
    if (pass !== MI_CONTRASEÑA) return alert("Contraseña incorrecta.");

    nombreUsuario = nombre;
    document.getElementById("paso-registro").classList.add("hidden");
    document.getElementById("paso-lectura").classList.remove("hidden");
    document.getElementById("saludoUsuario").innerText = "Hola, " + nombre;

    // Detectar día actual y cargar video
    const hoy = new Date().getDate();
    const videoUrl = videosMes[hoy];
    const btnVideo = document.getElementById("linkVideo");

    if (videoUrl) {
      btnVideo.href = videoUrl;
    } else {
      btnVideo.innerText = "📖 Fin de las lecturas programadas";
      btnVideo.style.background = "#9e9e9e";
      btnVideo.onclick = (e) => e.preventDefault();
    }
  }

  function activarBoton() {
    setTimeout(() => {
      document.getElementById("btnConfirmar").disabled = false;
      document.getElementById("msg-espera").classList.add("hidden");
    }, 1500);
  }

  function enviarRegistro() {
    const fechaStr = new Date().toLocaleDateString();
    document.getElementById("msg-final").classList.remove("hidden");
    
    // URL prellenada automática
    const urlFinal = `${URL_FORM}?usp=pp_url&${ID_CAMPO_NOMBRE}=${encodeURIComponent(nombreUsuario)}&${ID_CAMPO_FECHA}=${encodeURIComponent(fechaStr)}&${ID_CAMPO_ESTADO}=${encodeURIComponent("CONFIRMADO")}`;
    
    setTimeout(() => {
      window.location.href = urlFinal;
    }, 1000);
  }
</script>

</body>
</html>
