<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Faro de Luz - Reto Bíblico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f8e9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 450px; width: 100%; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
    .header-faro { color: #1b5e20; margin-bottom: 5px; }
    .header-faro h1 { font-size: 24px; margin: 0; letter-spacing: 1px; }
    .header-faro h2 { font-size: 18px; color: #2e7d32; margin: 5px 0 20px 0; font-weight: 400; }
    .contador-caja { background: #2e7d32; color: white; padding: 15px; border-radius: 12px; margin: 15px 0; display: flex; justify-content: space-around; align-items: center; }
    .contador-item { display: flex; flex-direction: column; }
    .contador-numero { font-size: 24px; font-weight: bold; }
    .contador-label { font-size: 10px; text-transform: uppercase; opacity: 0.9; }
    .badge-info { background: #e8f5e9; color: #2e7d32; padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; }
    .selector-recuperacion { background: #fff8e1; border: 2px solid #ffb300; border-radius: 12px; padding: 15px; margin: 20px 0; }
    select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ffb300; font-size: 16px; background: white; outline: none; }
    .boton { display: block; width: 100%; padding: 15px; margin-top: 10px; font-size: 16px; font-weight: bold; text-decoration: none; border-radius: 8px; cursor: pointer; border: none; transition: 0.3s; box-sizing: border-box; }
    .btn-video { background: #c4302b; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-confirmar { background: #2e7d32; color: white; margin-top: 25px; }
    .btn-confirmar:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
    .hidden { display: none; }
    .alerta { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; font-size: 13px; margin-top: 15px; border: 1px solid #ffeeba; }
    .success-card { background: #d4edda; color: #155724; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #c3e6cb; font-weight: bold; }
    input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
    .link-reset { font-size: 11px; color: #999; margin-top: 25px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-faro">
    <h1>FARO DE LUZ</h1>
    <h2>LECTURA BÍBLICA DIARIA</h2>
  </div>

  <div id="paso-registro">
    <p style="color:#666">Ingresa para comenzar el plan Feb-Dic</p>
    <input type="text" id="nombreInput" placeholder="Nombre Completo">
    <input type="password" id="passInput" placeholder="Contraseña del grupo">
    <button class="boton btn-confirmar" onclick="iniciarSesion()">Ingresar al Reto</button>
  </div>

  <div id="paso-lectura" class="hidden">
    <div class="badge-info">META: TERMINAR EL 31 DE DIC</div>
    <h2 id="saludoUsuario" style="color: #2e7d32; margin-top: 15px; margin-bottom: 5px;"></h2>

    <div class="contador-caja">
      <div class="contador-item">
        <span class="contador-numero" id="diasFaltan">0</span>
        <span class="contador-label">Días restantes</span>
      </div>
      <div style="font-size: 20px;">🏁</div>
      <div class="contador-item">
        <span class="contador-numero">31</span>
        <span class="contador-label">Diciembre</span>
      </div>
    </div>
    
    <div class="selector-recuperacion">
      <label style="display:block; margin-bottom:8px; font-weight:bold; color:#856404;">📅 Lectura del día:</label>
      <select id="diaCalendario" onchange="actualizarVideos()"></select>
    </div>

    <div id="contenedor-videos"></div>

    <div id="msg-espera" class="alerta">
      ⏳ Observa los videos correspondientes del día para confirmar
    </div>

    <button id="btnConfirmar" class="boton btn-confirmar" disabled onclick="enviarRegistro()">
      ✅ Confirmar Lectura Realizada
    </button>

    <div id="confirmacion-ok" class="hidden success-card">
      🙌 ¡Registro exitoso enviado! Dios te bendiga.
    </div>

    <div class="link-reset" onclick="borrarRegistro()">Cambiar de usuario / Salir</div>
  </div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {mostrarExito();}"></iframe>
<form id="googleForm" action="https://docs.google.com/forms/d/e/1FAIpQLSc6uZXnD52GUgV_wHzREZf6PU3XY6Kic7gXsBpvXmHEMOmEIA/formResponse" method="post" target="hidden_iframe" class="hidden">
  <input type="hidden" name="entry.895757803" id="entry_nombre">
  <input type="hidden" name="entry.1796484094" id="entry_fecha">
  <input type="hidden" name="entry.911384295" id="entry_estado">
</form>

<script>
  let submitted = false;
  let timerActivo = false;
  const MI_CONTRASEÑA = "biblia"; 
  const baseVideos = {
    1: "https://youtu.be/diUaiAJ9OP0", 2: "https://youtu.be/ZOELPNr_DpI",
    3: "https://youtu.be/idKTQdIoxbY", 4: "https://youtu.be/qd49LBB8tGI",
    5: "https://youtu.be/8l8DqqI_gxE", 6: "https://youtu.be/jSbPQ_CbCNo",
    7: "https://youtu.be/jfIgrT7vrqI", 8: "https://youtu.be/oNzleX15zy4"
  };

  window.onload = function() {
    const nombre = localStorage.getItem("nombreBiblia");
    if (nombre) mostrarPanel(nombre);
    calcularDias();
  };

  function calcularDias() {
    const hoy = new Date();
    const fin = new Date(hoy.getFullYear(), 11, 31);
    const diff = Math.ceil((fin - hoy) / (1000 * 60 * 60 * 24));
    document.getElementById("diasFaltan").innerText = diff > 0 ? diff : 0;
  }

  function iniciarSesion() {
    const nombre = document.getElementById("nombreInput").value.trim();
    const pass = document.getElementById("passInput").value;
    if (nombre.length < 4 || pass !== MI_CONTRASEÑA) return alert("Datos incorrectos");
    localStorage.setItem("nombreBiblia", nombre);
    mostrarPanel(nombre);
  }

  function mostrarPanel(nombre) {
    document.getElementById("paso-registro").classList.add("hidden");
    document.getElementById("paso-lectura").classList.remove("hidden");
    document.getElementById("saludoUsuario").innerText = "¡Hola, " + nombre.split(' ')[0] + "!";
    
    const selector = document.getElementById("diaCalendario");
    const hoy = new Date().getDate();
    for (let i = 0; i < 5; i++) {
        let d = hoy - i;
        if (d > 0) {
            let opt = document.createElement("option");
            opt.value = d;
            opt.text = (i === 0) ? `Hoy (${d} de Feb)` : `Recuperar (${d} de Feb)`;
            selector.add(opt);
        }
    }
    actualizarVideos();
  }

  function actualizarVideos() {
    const dia = parseInt(document.getElementById("diaCalendario").value);
    const contenedor = document.getElementById("contenedor-videos");
    contenedor.innerHTML = "";
    
    document.getElementById("btnConfirmar").disabled = true;
    document.getElementById("msg-espera").classList.remove("hidden");
    document.getElementById("msg-espera").innerText = "⏳ Observa los videos correspondientes del día para confirmar";
    timerActivo = false;

    let vA = (dia * 2) - 1;
    let vB = (dia * 2);

    [vA, vB].forEach(num => {
      const a = document.createElement("a");
      a.className = "boton btn-video";
      a.target = "_blank";
      a.href = baseVideos[num] || "https://www.youtube.com/results?search_query=Biblia+dramatizada+dia+" + num;
      a.innerHTML = "📖 Escuchar Día " + num;
      
      a.onclick = () => { 
        if (!timerActivo) {
          timerActivo = true;
          // El mensaje se queda estático pero el timer sigue corriendo
          setTimeout(() => { 
            document.getElementById("btnConfirmar").disabled = false; 
            document.getElementById("msg-espera").classList.add("hidden"); 
          }, 300000); // 5 minutos
        }
      };
      contenedor.appendChild(a);
    });
  }

  function enviarRegistro() {
    const nombre = localStorage.getItem("nombreBiblia");
    const dia = document.getElementById("diaCalendario").value;
    document.getElementById("entry_nombre").value = nombre;
    document.getElementById("entry_fecha").value = dia + " de Feb";
    document.getElementById("entry_estado").value = "COMPLETADO";
    submitted = true;
    document.getElementById("googleForm").submit();
  }

  function mostrarExito() {
    document.getElementById("confirmacion-ok").classList.remove("hidden");
    document.getElementById("btnConfirmar").disabled = true;
    document.getElementById("btnConfirmar").innerText = "¡ENVIADO!";
  }

  function borrarRegistro() {
    if(confirm("¿Cerrar sesión?")) {
      localStorage.removeItem("nombreBiblia");
      location.reload();
    }
  }
</script>
</body>
</html>
