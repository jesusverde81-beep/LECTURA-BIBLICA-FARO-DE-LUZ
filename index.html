  window.onload = function() {
    const nombre = localStorage.getItem("nombreBiblia");
    if (nombre) mostrarPanel(nombre);

  };

  function calcularDias() {
    const hoy = new Date();
    const fin = new Date(hoy.getFullYear(), 11, 31);
    const diff = Math.ceil((fin - hoy) / (1000 * 60 * 60 * 24));
    document.getElementById("diasFaltan").innerText = diff > 0 ? diff : 0;
  }

  function iniciarSesion() {
    const nombre = document.getElementById("nombreInput").value.trim();
    const pass = document.getElementById("passInput").value;
    if (nombre.length < 4 || pass !== MI_CONTRASEÑA) return alert("Datos incorrectos");
    localStorage.setItem("nombreBiblia", nombre);
    mostrarPanel(nombre);
  }

  function mostrarPanel(nombre) {
    document.getElementById("paso-registro").classList.add("hidden");
    document.getElementById("paso-lectura").classList.remove("hidden");
    document.getElementById("saludoUsuario").innerText = "¡Hola, " + nombre.split(' ')[0] + "!";
    
    const selector = document.getElementById("diaCalendario");
    for (let d = 1; d <= 87; d++) {
        let opt = document.createElement("option");
        opt.value = d;
        opt.text = "Día " + d;
        selector.add(opt);
    }

    const diaDelAño = Math.floor(dif / unDia);
    
    // Asigna el día actual al selector
    selector.value = diaDelAño; 
    actualizarVideos();
  }

  function actualizarVideos() {
    const diaNum = parseInt(document.getElementById("diaCalendario").value);
    const diaKey = diaNum.toString();
    const contenedor = document.getElementById("contenedor-videos");
    const btn = document.getElementById("btnConfirmar");
    const msg = document.getElementById("msg-espera");
    const ok = document.getElementById("confirmacion-ok");
    
    contenedor.innerHTML = "";
    timerActivo = false;
    const historial = JSON.parse(localStorage.getItem("historialLecturas") || "[]");
    
    if (historial.includes(diaKey)) {
      btn.classList.add("hidden");
      msg.classList.add("hidden");
      ok.classList.remove("hidden");
    } else {
      btn.classList.remove("hidden");
      btn.disabled = true;
      msg.classList.remove("hidden");
      ok.classList.add("hidden");

      let vidsAMostrar = [];
      if (diaNum <= 30) {
        vidsAMostrar.push({n: (diaNum * 2) - 1, url: baseVideos[(diaNum * 2) - 1]});
        vidsAMostrar.push({n: (diaNum * 2), url: baseVideos[(diaNum * 2)]});
      } else if (diaNum >= 61) {
        vidsAMostrar.push({n: diaNum, url: baseVideos[diaNum]});
      }

      vidsAMostrar.forEach(v => {
        if(v.url) {
          const a = document.createElement("a");
          a.className = "boton btn-video";
          a.target = "_blank"; a.href = v.url;
          a.innerHTML = "📖 Ver Lectura #" + v.n;
          a.onclick = () => {
            if(!timerActivo) {
              timerActivo = true;
              setTimeout(() => { btn.disabled = false; msg.classList.add("hidden"); }, 300000);
            }
          };
          contenedor.appendChild(a);
        }
      });
    }

  function enviarRegistro() {
    const nombre = localStorage.getItem("nombreBiblia");
    const dia = document.getElementById("diaCalendario").value;
    document.getElementById("entry_nombre").value = nombre;
    document.getElementById("entry_fecha").value = "Día " + dia;
    document.getElementById("entry_estado").value = "COMPLETADO";
    const historial = JSON.parse(localStorage.getItem("historialLecturas") || "[]");
    historial.push(dia);
    localStorage.setItem("historialLecturas", JSON.stringify(historial));
    submitted = true;
    document.getElementById("googleForm").submit();
  }

  function finalizarEnvio() { actualizarVideos(); }
  function borrarRegistro() { if(confirm("¿Cerrar sesión?")) { localStorage.clear(); location.reload(); } }
