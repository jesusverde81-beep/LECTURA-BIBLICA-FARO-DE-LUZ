  function mostrarFraseAleatoria() {
    const fraseDiv = document.getElementById("fraseDia");
    if (fraseDiv) {
      const indice = Math.floor(Math.random() * frases.length);
      fraseDiv.innerText = frases[indice];
    }
  }

  function calcularDias() {
    const hoy = new Date();
    const fin = new Date(hoy.getFullYear(), 11, 31);
    const diff = Math.ceil((fin - hoy) / (1000 * 60 * 60 * 24));
    document.getElementById("diasFaltan").innerText = diff > 0 ? diff : 0;
  }

  function mostrarPanel(nombre) {
    document.getElementById("paso-registro").classList.add("hidden");
    document.getElementById("paso-lectura").classList.remove("hidden");
    document.getElementById("saludoUsuario").innerText = "¡Hola, " + nombre.split(' ')[0] + "!";

    const selector = document.getElementById("diaCalendario");
    selector.innerHTML = "";
    
    for (let d = 75; d <= 144; d++) {
      if (baseVideos[d]) {
        let opt = document.createElement("option");
        opt.value = d;
        opt.text = "Día " + d;
        selector.add(opt);
      }
    }

    const diaHoy = Math.floor((ahora - inicioAño) / (1000 * 60 * 60 * 24));
    if (diaHoy >= 75 && diaHoy <= 144 && baseVideos[diaHoy]) {
      selector.value = diaHoy;
    } else {
      selector.value = 75;
    }
    actualizarVideos();

  function actualizarVideos() {
    const selector = document.getElementById("diaCalendario");
    const diaNum = parseInt(selector.value);
    const contenedor = document.getElementById("contenedor-videos");
    const btn = document.getElementById("btnConfirmar");
    const msg = document.getElementById("msg-espera");
    const ok = document.getElementById("confirmacion-ok");
    
    contenedor.innerHTML = "";
    timerActivo = false;
    const historial = JSON.parse(localStorage.getItem("historialLecturas") || "[]");
    
    if (historial.includes(diaNum.toString())) {
      btn.classList.add("hidden");
      msg.classList.add("hidden");
      ok.classList.remove("hidden");
    } else {
      btn.classList.remove("hidden");
      btn.disabled = true;
      msg.classList.remove("hidden");
      ok.classList.add("hidden");
      
      const a = document.createElement("a");
      a.className = "boton btn-video";
      a.target = "_blank";
      a.href = "https://www.youtube.com/watch?v=" + baseVideos[diaNum];
      a.innerHTML = "📖 Abrir Video del Día " + diaNum;
      a.onclick = () => {
        if(!timerActivo) {
          timerActivo = true;
          setTimeout(() => { 
            btn.disabled = false; 
            msg.classList.add("hidden");
          }, 300000);
        }
      };
      contenedor.appendChild(a);
    }
  }

  function iniciarSesion() {
    const nombre = document.getElementById("nombreInput").value.trim();
    const pass = document.getElementById("passInput").value;
    
    if (nombre.length < 4) {
      return alert("Por favor ingresa un nombre válido (mínimo 4 caracteres)");
    }
    if (pass !== MI_CONTRASEÑA) {
      return alert("Contraseña incorrecta");
    }
    
    localStorage.setItem("nombreBiblia", nombre);
    mostrarPanel(nombre);
  }

  function enviarRegistro() {
    submitted = true;
    const nombre = localStorage.getItem("nombreBiblia");
    const dia = document.getElementById("diaCalendario").value;
    
    document.getElementById("entry_nombre").value = nombre;
    document.getElementById("entry_fecha").value = "Día " + dia;
    document.getElementById("entry_estado").value = "COMPLETADO";
    
    const historial = JSON.parse(localStorage.getItem("historialLecturas") || "[]");
    if (!historial.includes(dia)) {
      historial.push(dia);
      localStorage.setItem("historialLecturas", JSON.stringify(historial));
    }
    
    document.getElementById("googleForm").submit();
  }

  function finalizarEnvio() {
    actualizarVideos();
    setTimeout(() => {
      const okDiv = document.getElementById("confirmacion-ok");
      if (okDiv && !okDiv.classList.contains("hidden")) {

  function borrarRegistro() {
    if (confirm("¿Estás seguro que deseas salir? Se borrará tu progreso.")) {
